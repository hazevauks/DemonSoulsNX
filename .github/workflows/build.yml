name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build tools
        run: |
          apt-get update -qq
          apt-get install -y -qq cmake ninja-build python3

      - name: Repository check
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 tools/check_repo.py

      # pkg.devkitpro.org at times answers GitHub's runners with 403 for a minute or so: try again
      - name: Libraries
        run: |
          for try in 1 2 3 4; do
            dkp-pacman -Syu --noconfirm --needed switch-dev deko3d uam switch-sdl2 switch-openal-soft switch-zlib && exit 0
            echo "::warning::the package server refused (try $try of 4), waiting"
            sleep 45
          done
          exit 1

      - name: Build
        run: ./build.sh

      - name: NRO check
        run: python3 tools/check_nro.py build/demonsouls.nro

      # stage 1: the NRO holds no game code yet. From stage 4 on, only the runtime is shared.
      - uses: actions/upload-artifact@v4
        with:
          name: demonsouls-nro
          path: |
            build/demonsouls.nro
            build/demonsouls.elf
          retention-days: 14

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/demonsouls.nro
          draft: true
